# The main pipeline for genaiclass

resources:
  pipelines:
    genaiclass_etl:
      name: genaiclass_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/genaiclass_etl"

      libraries:
        - glob:
            include: ../src/genaiclass_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
