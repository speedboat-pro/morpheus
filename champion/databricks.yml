# This is a Databricks asset bundle definition for champion.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: champion
  uuid: cf68e3f6-d3fb-482b-8b54-48cc3e27abf2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-753e2c8f-3714.cloud.databricks.com
    variables:
      catalog: dbacademy
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-753e2c8f-3714.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/labuser15436857_1783341116@vocareum.com to make sure we only have a single copy.
      root_path: /Workspace/Users/labuser15436857_1783341116@vocareum.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbacademy
      schema: ${workspace.current_user.short_name}
    permissions:
      - user_name: labuser15436857_1783341116@vocareum.com
        level: CAN_MANAGE
