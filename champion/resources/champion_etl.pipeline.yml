# The main pipeline for champion

resources:
  pipelines:
    champion_etl:
      name: champion_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/champion_etl"

      libraries:
        - glob:
            include: ../src/champion_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
